services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalkulator}
      POSTGRES_USER: ${POSTGRES_USER:-kalkulator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w pliku .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Baza NIE wystawia portu na hosta — dostęp tylko z sieci wewnętrznej compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kalkulator} -d ${POSTGRES_DB:-kalkulator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kalkulator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kalkulator}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8010}:8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  media_data:
